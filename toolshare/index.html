<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>ToolShare Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra del magazzino in alto, schede per ruolo, colonna di lavoro unica larga max 1080px; schede attrezzo come righe di un bancone. */
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --surface-2: #F5F7F9;
  --ink: #15212C;
  --muted: #586776;
  --line: #D3DAE1;
  --brand: #1E3A50;
  --brand-ink: #F1F5F8;
  --brand-muted: #A9BCCB;
  --accent: #E3A324;
  --accent-ink: #1C1400;
  --accent-soft: #FBF0D6;
  --ok: #2C7A4D; --ok-soft: #E2F2E8;
  --warn: #9A6410; --warn-soft: #FCEFD7;
  --crit: #B23E2E; --crit-soft: #F9E3DF;
  --info: #2D6491; --info-soft: #E1ECF6;
  --focus: #2D6491;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151B; --surface: #16212A; --surface-2: #1B2731; --ink: #E5EBF0; --muted: #98A7B4; --line: #2A3946;
    --brand: #0A1218; --brand-ink: #E5EBF0; --brand-muted: #8DA2B3;
    --accent: #F0B43E; --accent-ink: #1C1400; --accent-soft: #3A2C10;
    --ok: #6CC894; --ok-soft: #173326; --warn: #E9B260; --warn-soft: #3A2B12; --crit: #EE8070; --crit-soft: #3D1E19; --info: #78B2E2; --info-soft: #152B3E; --focus: #78B2E2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151B; --surface: #16212A; --surface-2: #1B2731; --ink: #E5EBF0; --muted: #98A7B4; --line: #2A3946;
  --brand: #0A1218; --brand-ink: #E5EBF0; --brand-muted: #8DA2B3;
  --accent: #F0B43E; --accent-ink: #1C1400; --accent-soft: #3A2C10;
  --ok: #6CC894; --ok-soft: #173326; --warn: #E9B260; --warn-soft: #3A2B12; --crit: #EE8070; --crit-soft: #3D1E19; --info: #78B2E2; --info-soft: #152B3E; --focus: #78B2E2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); letter-spacing: .01em; text-wrap: balance; margin: 0; }
h2 { font-size: 1.6rem; font-weight: 600; }
h3 { font-size: 1.2rem; font-weight: 600; line-height: 1.2; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-size: .85em; }
.muted { color: var(--muted); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Barra superiore */
.topbar { background: var(--brand); color: var(--brand-ink); padding-inline: 16px; }
.topbar-in { max-width: 1080px; margin: 0 auto; padding-block: 14px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: .02em; line-height: 1; }
.brand-net { color: var(--brand-muted); font-size: .9rem; }
.who { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: .9rem; color: var(--brand-muted); }
@media (max-width: 600px) { .who { width: 100%; } .who select { flex: 1 1 100%; } }
.who select { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-weight: 600; }

.tabs-wrap { background: var(--surface); border-bottom: 1px solid var(--line); padding-inline: 16px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.tabs { max-width: 1080px; margin: 0 auto; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 14px 12px 12px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.count { background: var(--accent); color: var(--accent-ink); font-size: .75rem; font-weight: 700; border-radius: 999px; padding: 0 7px; line-height: 1.5; font-variant-numeric: tabular-nums; }

main { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: grid; gap: 24px; }
.head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: end; justify-content: space-between; }
.head p { max-width: 62ch; }
.notice { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--r); padding: 12px 16px; display: flex; gap: 12px; align-items: flex-start; }
.notice.crit { background: var(--crit-soft); border-color: var(--crit); }

/* Pulsanti */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--crit); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--info); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: .82rem; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.muted { background: var(--surface-2); color: var(--muted); }

/* Ricerca e filtri */
.search { display: flex; gap: 8px; flex-wrap: wrap; }
.search input { flex: 1 1 260px; min-width: 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: .9rem; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Liste */
.list { display: grid; gap: 10px; }
.tool { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; }
.tool-meta { font-size: .85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 2px; }
.tool-cat { text-transform: uppercase; letter-spacing: .06em; font-size: .75rem; font-weight: 700; color: var(--muted); }
.tool-side { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.tag-mine { font-size: .8rem; font-weight: 700; color: var(--info); }
@media (max-width: 600px) { .tool { grid-template-columns: 1fr; } .tool-side { justify-content: flex-start; } }

.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 24px; text-align: center; display: grid; gap: 10px; justify-items: center; color: var(--muted); }

.section { display: grid; gap: 12px; }
.section-title { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.section-title h3 { font-size: 1.25rem; }

/* Prestito */
.loan { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.loan.attn { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.loan-top { display: flex; gap: 8px 16px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.loan-route { font-size: .92rem; color: var(--muted); }
.loan-route b { color: var(--ink); font-weight: 600; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.steps li { font-size: .72rem; color: var(--muted); display: grid; gap: 4px; min-width: 0; }
.steps li::before { content: ""; height: 5px; border-radius: 3px; background: var(--line); }
.steps li.done::before { background: var(--ok); }
.steps li.now::before { background: var(--accent); }
.steps li.now { color: var(--ink); font-weight: 700; }
.steps span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 600px) { .steps li span { display: none; } .steps li.now span { display: block; overflow: visible; } }
.loan-actions { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; padding-top: 12px; border-top: 1px solid var(--line); }
.loan-actions label { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; }
.loan-actions select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.loan-note { font-size: .9rem; }
.outcome { font-size: .9rem; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); }

/* Cruscotto */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; }
.kpi b { font-family: var(--font-display); font-size: 2.2rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: .88rem; color: var(--muted); }
.kpi.hot { border-color: var(--accent); background: var(--accent-soft); }
.giro { display: grid; gap: 10px; }
.giro-h { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; }
.giro-h .mono { background: var(--brand); color: var(--brand-ink); border-radius: 6px; padding: 2px 8px; font-size: .85rem; }
details.history summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
details.history[open] summary { margin-bottom: 10px; }

/* Tabelle */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table { width: 100%; border-collapse: collapse; font-size: .93rem; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

/* Moduli */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: .85rem; font-weight: 600; }
.field input[type="text"], .field input[type="date"], .field input[type="number"], .field select, .field textarea { padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); width: 100%; min-width: 0; }
.field small { color: var(--muted); }
.radios { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.radios label, .checks label { display: inline-flex; gap: 6px; align-items: center; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 16px; padding-left: 4px; }
.err { color: var(--crit); font-size: .9rem; font-weight: 600; }
.row-end { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

/* Fondo */
.fund { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 16px; }
@media (max-width: 760px) { .fund { grid-template-columns: 1fr; } }
.balance { background: var(--brand); color: var(--brand-ink); border-radius: var(--r); padding: 18px; display: grid; gap: 6px; align-content: start; }
.balance b { font-family: var(--font-display); font-size: 2.6rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.balance span { color: var(--brand-muted); font-size: .9rem; }
.prop { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; }
.votes { text-align: center; min-width: 52px; }
.votes b { display: block; font-family: var(--font-display); font-size: 1.7rem; line-height: 1; font-variant-numeric: tabular-nums; }
.votes span { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.prop-act { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.prop-act input { width: 96px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
@media (max-width: 600px) { .prop { grid-template-columns: auto minmax(0, 1fr); } .prop-act { grid-column: 1 / -1; justify-content: flex-start; } }

/* Dialogo e toast */
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(520px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(10, 18, 24, .45); }
.dlg { padding: 20px; display: grid; gap: 14px; }
.dlg-info { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; font-size: .9rem; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-weight: 600; max-width: calc(100vw - 32px); z-index: 20; box-shadow: 0 6px 24px rgba(0,0,0,.2); }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .2s ease-out; } @keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } } }

footer { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 0 32px; color: var(--muted); font-size: .85rem; display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="var(--accent)"/><path d="M22.5 8.5a5 5 0 0 0-6.3 6.3l-7.4 7.4a1.8 1.8 0 0 0 2.5 2.5l7.4-7.4a5 5 0 0 0 6.3-6.3l-2.9 2.9-2.4-.6-.6-2.4z" fill="var(--accent-ink)"/></svg>
      <div>
        <div class="brand-name">ToolShare Pro</div>
        <div class="brand-net">Rete Ricambi Ferri · Modena</div>
      </div>
    </div>
    <label class="who" for="me">Vedi la demo come
      <select id="me"></select>
    </label>
  </div>
</header>
<div class="tabs-wrap"><nav class="tabs" id="tabs" role="tablist" aria-label="Sezioni"></nav></div>
<main id="main"></main>
<footer>
  <span>Demo con dati di esempio. Ogni prestito è un comodato gratuito tra officine, gestito dal magazzino.</span>
  <button class="link" data-act="reset" type="button">Ripristina i dati della demo</button>
</footer>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

<script>
(() => {
const MAG = 'mag';
const GIRI = ['08:30', '11:30', '15:30'];
const CATS = ['Motore', 'Sollevamento', 'Pneumatici', 'Freni', 'Sospensioni', 'Diagnostica', 'Elettrico', 'Climatizzazione'];
const STEPS = ['Richiesta', 'Accettata', 'Approvata', 'Ritirata', 'Consegnata', 'In rientro', 'Chiusa'];
const IDX = { richiesta: 0, accettata: 1, approvata: 2, ritirata: 3, consegnata: 4, rientro: 5, chiusa: 6 };
const LABEL = { richiesta: 'Attende il proprietario', accettata: 'Attende il magazzino', approvata: 'Ritiro pianificato', ritirata: 'In viaggio', consegnata: 'In uso', rientro: 'In rientro', chiusa: 'Concluso', rifiutata: 'Rifiutato', annullata: 'Annullato' };
const TONE = { richiesta: 'warn', accettata: 'warn', approvata: 'info', ritirata: 'info', consegnata: 'ok', rientro: 'info', chiusa: 'muted', rifiutata: 'crit', annullata: 'muted' };
const ACTIVE = ['accettata', 'approvata', 'ritirata', 'consegnata', 'rientro'];
const OPEN = ['richiesta', ...ACTIVE];
const KEY = 'toolshare-demo-v2';
const MESI = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
const eur = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });

const iso = d => d.toISOString().slice(0, 10);
const TODAY = iso(new Date());
const plus = n => { const d = new Date(TODAY + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const fmt = s => { const m = Number(s.slice(5, 7)); return `${Number(s.slice(8, 10))} ${MESI.at(m - 1)}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + Math.random().toString(36).slice(2, 8);

function seed() {
  return {
    me: 'rossi', tab: 'catalogo', q: '', cat: '',
    officine: [
      { id: 'rossi', nome: 'Officina Rossi', citta: 'Modena', sospesa: false },
      { id: 'verde', nome: 'Autofficina Verde', citta: 'Carpi', sospesa: false },

      { id: 'gialli', nome: 'Garage Gialli', citta: 'Modena', sospesa: false }
    ],
    tools: [
      { id: 't1', nome: 'Kit messa in fase 1.6 / 2.0 TDI', cat: 'Motore', owner: 'bianchi', compat: 'VW, Audi, Seat, Skoda', visibile: true, a: 'tutti' },

      { id: 't3', nome: 'Smontagomme semiautomatico', cat: 'Pneumatici', owner: 'rossi', compat: 'Cerchi 10–24"', visibile: true, a: 'tutti' },
      { id: 't4', nome: 'Caricabatterie professionale 12 V 50 A', cat: 'Elettrico', owner: MAG, compat: 'Universale', visibile: true, a: 'tutti' },
      { id: 't5', nome: 'Estrattore iniettori common rail', cat: 'Motore', owner: 'neri', compat: 'Bosch, Delphi, Denso', visibile: true, a: 'tutti' },
      { id: 't6', nome: 'Kit spurgo freni a pressione', cat: 'Freni', owner: 'rossi', compat: 'Universale', visibile: true, a: 'tutti' },
      { id: 't7', nome: 'Tester batteria e impianto di ricarica', cat: 'Diagnostica', owner: MAG, compat: 'Batterie 6–24 V', visibile: true, a: 'tutti' },
      { id: 't8', nome: 'Compressore molle ammortizzatori', cat: 'Sospensioni', owner: 'verde', compat: 'Molle Ø 80–200 mm', visibile: true, a: 'tutti' },
      { id: 't9', nome: 'Kit messa in fase 1.3 Multijet', cat: 'Motore', owner: MAG, compat: 'Fiat, Alfa Romeo, Lancia, Opel', visibile: true, a: 'tutti' },
      { id: 't10', nome: 'Videoendoscopio da ispezione 8 mm', cat: 'Diagnostica', owner: 'bianchi', compat: 'Universale', visibile: true, a: 'tutti' },
      { id: 't11', nome: 'Stazione di ricarica A/C R1234yf', cat: 'Climatizzazione', owner: 'neri', compat: 'Gas R1234yf', visibile: true, a: ['verde', 'rossi'] }
    ],
    loans: [
      { id: 'L1', tool: 't1', owner: 'bianchi', by: 'rossi', dal: TODAY, al: plus(2), stato: 'ritirata', giro: '15:30', lavoro: 'Golf VII 2.0 TDI, cinghia distribuzione' },
      { id: 'L2', tool: 't4', owner: MAG, by: 'rossi', dal: plus(-3), al: plus(-1), stato: 'consegnata', giro: '08:30', lavoro: 'Furgone Ducato, batteria a terra' },
      { id: 'L3', tool: 't8', owner: 'verde', by: 'bianchi', dal: plus(1), al: plus(3), stato: 'accettata', giro: '', lavoro: 'Clio IV, ammortizzatori anteriori' },
      { id: 'L4', tool: 't3', owner: 'rossi', by: 'neri', dal: plus(1), al: plus(2), stato: 'richiesta', giro: '', lavoro: 'Cambio gomme invernali, picco stagionale' },
      { id: 'L5', tool: 't5', owner: 'neri', by: 'verde', dal: plus(-12), al: plus(-10), stato: 'chiusa', giro: '11:30', lavoro: 'Transit 2.2 TDCi', esito: 'nessuno' },
      { id: 'L6', tool: 't11', owner: 'neri', by: 'rossi', dal: plus(-20), al: plus(-19), stato: 'chiusa', giro: '08:30', lavoro: '500X, ricarica clima', esito: 'usura' }
    ],
    fondo: {
      saldo: 1840,
      quota: '1% degli acquisti di ricambi della rete',
      proposte: [
        { id: 'p1', nome: 'Riscaldatore a induzione', stima: 690, voti: ['rossi', 'neri', 'verde'], cercato: 5 },
        { id: 'p2', nome: 'Kit messa in fase 1.0 EcoBoost', stima: 420, voti: ['rossi', 'bianchi'], cercato: 4 },
        { id: 'p3', nome: 'Kit estrazione silent-block bracci', stima: null, voti: ['verde'], cercato: 2 }
      ],
      acquisti: [{ nome: 'Tester batteria e impianto di ricarica', spesa: 380, data: plus(-140) }]
    }
  };
}

let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
if (!S || !S.loans) S = seed();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const $ = s => document.querySelector(s);
const name = id => id === MAG ? 'Magazzino Ricambi Ferri' : (S.officine.find(o => o.id === id)?.nome ?? id);
const short = id => id === MAG ? 'Magazzino' : name(id);
const tool = id => S.tools.find(t => t.id === id);
const off = id => S.officine.find(o => o.id === id);
const isMag = () => S.me === MAG;
const activeLoan = tid => S.loans.find(l => l.tool === tid && ACTIVE.includes(l.stato));
const myShared = id => S.tools.filter(t => t.owner === id && t.visibile).length;
const canSee = t => t.owner === S.me || isMag() || (t.visibile && (t.a === 'tutti' || t.a.includes(S.me)));
const late = l => l.stato === 'consegnata' && l.al < TODAY;

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200); }

/* ---------- Struttura ---------- */
function tabsFor() {
  if (isMag()) {
    const daApprovare = S.loans.filter(l => l.stato === 'accettata').length;
    return [['cruscotto', 'Cruscotto', daApprovare], ['catalogo', 'Catalogo della rete'], ['attrezzi', 'Attrezzi del magazzino'], ['rete', 'Officine'], ['fondo', 'Fondo attrezzi']];
  }
  const ricevute = S.loans.filter(l => l.owner === S.me && l.stato === 'richiesta').length;
  const attivi = S.loans.filter(l => l.by === S.me && OPEN.includes(l.stato)).length;
  return [['catalogo', 'Catalogo'], ['prestiti', 'I miei prestiti', attivi], ['attrezzi', 'I miei attrezzi', ricevute], ['fondo', 'Fondo attrezzi']];
}

function render() {
  $('#me').innerHTML = `<option value="${MAG}">Magazzino Ricambi Ferri (gestore)</option>` + S.officine.map(o => `<option value="${o.id}">${esc(o.nome)}</option>`).join('');
  $('#me').value = S.me;
  const tabs = tabsFor();
  if (!tabs.some(t => t[0] === S.tab)) S.tab = tabs[0][0];
  $('#tabs').innerHTML = tabs.map(([id, label, n]) => `<button class="tab" role="tab" type="button" aria-selected="${S.tab === id}" data-act="tab" data-id="${id}">${label}${n ? `<span class="count">${n}</span>` : ''}</button>`).join('');
  const views = { catalogo: vCatalogo, prestiti: vPrestiti, attrezzi: vAttrezzi, fondo: vFondo, cruscotto: vCruscotto, rete: vRete };
  $('#main').innerHTML = views[S.tab]();
  if (S.tab === 'catalogo') renderResults();
  save();
}

/* ---------- Catalogo ---------- */
function vCatalogo() {
  const me = off(S.me);
  let banner = '';
  if (!isMag() && me?.sospesa) banner = `<div class="notice crit"><div><b>Il magazzino ha sospeso la tua officina.</b> Puoi consultare il catalogo ma non chiedere prestiti. Contatta il magazzino per la riattivazione.</div></div>`;
  else if (!isMag() && myShared(S.me) === 0) banner = `<div class="notice"><div><b>Metti a disposizione almeno un attrezzo per chiedere prestiti.</b> È la regola della rete: chi prende, presta. <button class="link" data-act="tab" data-id="attrezzi">Aggiungi un attrezzo</button></div></div>`;
  return `
  <div class="head"><div><h2>${isMag() ? 'Catalogo della rete' : 'Catalogo condiviso'}</h2>
  <p class="muted">${isMag() ? 'Tutti gli attrezzi messi a disposizione dalle officine e dal magazzino.' : 'Attrezzi delle officine della rete e del magazzino. Il prestito è gratuito e arriva con il giro consegne.'}</p></div></div>
  ${banner}
  <div class="search"><input id="q" type="search" placeholder="Cerca per attrezzo, marca o motore (es. TDI, Multijet)" value="${esc(S.q)}" aria-label="Cerca attrezzo"></div>
  <div class="chips" role="group" aria-label="Categoria">${['', ...CATS].map(c => `<button type="button" class="chip" data-act="cat" data-id="${c}" aria-pressed="${S.cat === c}">${c || 'Tutte'}</button>`).join('')}</div>
  <div id="results" class="list" aria-live="polite"></div>`;
}

function renderResults() {
  const q = S.q.trim().toLowerCase();
  const items = S.tools.filter(canSee)
    .filter(t => !S.cat || t.cat === S.cat)
    .filter(t => !q || (t.nome + ' ' + t.compat + ' ' + t.cat + ' ' + name(t.owner)).toLowerCase().includes(q));
  const box = $('#results');
  if (!items.length) {
    box.innerHTML = `<div class="empty"><b>Nessun attrezzo trovato${q ? ` per “${esc(S.q)}”` : ''}.</b>
      ${q && !isMag() ? `<span>Segnala che lo cerchi: il magazzino lo valuta per il fondo attrezzi.</span><button class="btn primary" type="button" data-act="wanted">Segnala “${esc(S.q.trim())}”</button>` : ''}</div>`;
    return;
  }
  box.innerHTML = items.map(toolRow).join('');
}

function toolRow(t) {
  const busy = activeLoan(t.id);
  const mine = t.owner === S.me;
  const myReq = S.loans.find(l => l.tool === t.id && l.by === S.me && OPEN.includes(l.stato));
  let status = t.visibile ? (busy ? `<span class="pill warn">In prestito fino al ${fmt(busy.al)}</span>` : `<span class="pill ok">Disponibile</span>`) : `<span class="pill muted">Non visibile</span>`;
  let action = '';
  if (mine) action = `<span class="tag-mine">${isMag() ? 'Del magazzino' : 'Tuo'}</span>`;
  else if (!isMag()) {
    if (myReq) action = `<button class="btn ghost" type="button" data-act="tab" data-id="prestiti">Vedi la tua richiesta</button>`;
    else action = `<button class="btn primary" type="button" data-act="ask" data-id="${t.id}">${busy ? 'Prenota' : 'Richiedi in prestito'}</button>`;
  }
  const limited = t.a !== 'tutti' ? `<span>Visibile solo a officine scelte</span>` : '';
  return `<article class="tool"><div style="min-width:0">
    <div class="tool-cat">${esc(t.cat)}</div><h3>${esc(t.nome)}</h3>
    <div class="tool-meta"><span>${t.owner === MAG ? 'Del magazzino' : 'Di ' + esc(name(t.owner))}</span><span class="mono">${esc(t.compat)}</span>${limited}</div>
  </div><div class="tool-side">${status}${action}</div></article>`;
}

/* ---------- Richiesta ---------- */
function openAsk(tid) {
  const t = tool(tid);
  const me = off(S.me);
  const dlg = $('#dlg');
  if (me.sospesa || myShared(S.me) === 0) {
    dlg.innerHTML = `<div class="dlg"><h3>Non puoi ancora chiedere prestiti</h3>
      <p>${me.sospesa ? 'La tua officina è sospesa dal magazzino.' : 'Per chiedere un attrezzo devi metterne a disposizione almeno uno dei tuoi. Così la rete resta equa per tutti.'}</p>
      <div class="row-end"><button class="btn" type="button" data-act="close">Chiudi</button>${me.sospesa ? '' : `<button class="btn primary" type="button" data-act="goadd">Aggiungi un attrezzo</button>`}</div></div>`;
    dlg.showModal(); return;
  }
  const busy = activeLoan(tid);
  const from = busy && busy.al >= TODAY ? plus(Math.max(1, Math.round((Date.parse(busy.al) - Date.parse(TODAY)) / 864e5) + 1)) : TODAY;
  dlg.innerHTML = `<form class="dlg" id="askForm" data-id="${tid}">
    <div><div class="tool-cat">${esc(t.cat)} · ${t.owner === MAG ? 'del magazzino' : 'di ' + esc(name(t.owner))}</div><h3>${esc(t.nome)}</h3></div>
    <div class="grid-2">
      <label class="field"><span>Dal</span><input type="date" id="ask-dal" value="${from}" min="${TODAY}" required></label>
      <label class="field"><span>Al</span><input type="date" id="ask-al" value="${from > plus(2) ? from : plus(2)}" min="${TODAY}" required></label>
    </div>
    <label class="field"><span>Per quale lavoro</span><input type="text" id="ask-lavoro" placeholder="es. Golf VII 2.0 TDI, distribuzione"><small>Aiuta il proprietario a capire l'uso previsto.</small></label>
    <div class="dlg-info">${t.owner === MAG ? 'Il magazzino approva e te lo consegna con il prossimo giro.' : `${esc(name(t.owner))} deve accettare. Poi il magazzino approva, lo ritira e te lo consegna con il giro consegne.`} Il prestito è gratuito: rispondi solo di danni da uso scorretto.</div>
    <p class="err" id="ask-err" hidden></p>
    <div class="row-end"><button class="btn" type="button" data-act="close">Annulla</button><button class="btn primary" type="submit">Invia richiesta</button></div>
  </form>`;
  dlg.showModal();
}

function submitAsk(form) {
  const tid = form.dataset.id, t = tool(tid);
  const dal = $('#ask-dal').value, al = $('#ask-al').value;
  if (al < dal) { const e = $('#ask-err'); e.textContent = 'La data di fine viene prima di quella di inizio. Correggi le date.'; e.hidden = false; return; }
  S.loans.unshift({ id: uid('L'), tool: tid, owner: t.owner, by: S.me, dal, al, stato: t.owner === MAG ? 'accettata' : 'richiesta', giro: '', lavoro: $('#ask-lavoro').value.trim() });
  $('#dlg').close();
  S.tab = 'prestiti';
  render();
  toast(t.owner === MAG ? 'Richiesta inviata al magazzino' : `Richiesta inviata a ${name(t.owner)}`);
}

/* ---------- Prestito ---------- */
function loanCard(l, opts = {}) {
  const t = tool(l.tool) || { nome: 'Attrezzo rimosso', cat: '' };
  const idx = IDX[l.stato] ?? -1;
  const steps = idx < 0 ? '' : `<ol class="steps" aria-label="Avanzamento">${STEPS.map((s, i) => `<li class="${i < idx || l.stato === 'chiusa' ? 'done' : i === idx ? 'now' : ''}"><span>${s}</span></li>`).join('')}</ol>`;
  const pill = late(l) ? `<span class="pill crit">In ritardo dal ${fmt(l.al)}</span>` : `<span class="pill ${TONE[l.stato]}">${LABEL[l.stato]}</span>`;
  const acts = actionsFor(l);
  const giro = l.giro && ['approvata', 'ritirata', 'rientro'].includes(l.stato) ? ` · giro delle <span class="mono">${l.giro}</span>` : '';
  let outcome = '';
  if (l.stato === 'chiusa' && l.esito) outcome = `<div class="outcome">${{ nessuno: 'Rientrato senza danni.', usura: 'Usura normale: nessun risarcimento.', scorretto: `Danno da uso scorretto: risarcimento chiesto a ${esc(name(l.by))}.` }[l.esito]}</div>`;
  if (l.ritiroPrenotato && l.stato === 'consegnata') outcome = `<div class="outcome">${esc(short(l.by))} ha prenotato il ritiro per la restituzione.</div>`;
  return `<article class="loan${acts && !opts.quiet ? ' attn' : ''}">
    <div class="loan-top"><div style="min-width:0"><h3>${esc(t.nome)}</h3>
      <div class="loan-route">Da <b>${esc(short(l.owner))}</b> a <b>${esc(short(l.by))}</b> · dal ${fmt(l.dal)} al ${fmt(l.al)}${giro}</div>
      ${l.lavoro ? `<div class="loan-note muted">${esc(l.lavoro)}</div>` : ''}</div>${pill}</div>
    ${steps}${outcome}
    ${acts ? `<div class="loan-actions">${acts}</div>` : ''}
  </article>`;
}

function actionsFor(l) {
  const me = S.me, id = l.id;
  if (l.stato === 'richiesta' && l.owner === me)
    return `<span class="loan-note">${esc(short(l.by))} chiede il tuo attrezzo.</span><button class="btn primary" type="button" data-act="accept" data-id="${id}">Accetta</button><button class="btn danger" type="button" data-act="decline" data-id="${id}">Rifiuta</button>`;
  if (me === MAG) {
    if (l.stato === 'accettata') return `<label>Giro di ritiro <select id="giro-${id}">${GIRI.map(g => `<option>${g}</option>`).join('')}</select></label><button class="btn primary" type="button" data-act="approve" data-id="${id}">Approva e pianifica</button><button class="btn danger" type="button" data-act="reject" data-id="${id}">Rifiuta</button>`;
    if (l.stato === 'approvata') return `<label><input type="checkbox" id="foto-${id}"> Foto di uscita scattate</label><button class="btn primary" type="button" data-act="pickup" data-id="${id}">Ritirato da ${esc(short(l.owner))}</button>`;
    if (l.stato === 'ritirata') return `<button class="btn primary" type="button" data-act="deliver" data-id="${id}">Consegnato a ${esc(short(l.by))}</button>`;
    if (l.stato === 'consegnata') return `<label>Giro di ritiro <select id="giro-${id}">${GIRI.map(g => `<option>${g}</option>`).join('')}</select></label><button class="btn${l.ritiroPrenotato || late(l) ? ' primary' : ''}" type="button" data-act="collect" data-id="${id}">Ritira per il rientro</button>`;
    if (l.stato === 'rientro') return `<label>Esito del controllo <select id="esito-${id}"><option value="nessuno">Nessun danno</option><option value="usura">Danno da usura normale</option><option value="scorretto">Danno da uso scorretto</option></select></label><label><input type="checkbox" id="foto-${id}"> Foto di rientro scattate</label><button class="btn primary" type="button" data-act="close-loan" data-id="${id}">Riconsegnato a ${esc(short(l.owner))}</button>`;
  }
  if (l.by === me && l.stato === 'consegnata' && !l.ritiroPrenotato) return `<button class="btn${late(l) ? ' primary' : ''}" type="button" data-act="book" data-id="${id}">Prenota il ritiro per la restituzione</button>`;
  if (l.by === me && (l.stato === 'richiesta' || l.stato === 'accettata')) return `<button class="btn ghost" type="button" data-act="cancel" data-id="${id}">Annulla la richiesta</button>`;
  return '';
}

/* ---------- I miei prestiti ---------- */
function vPrestiti() {
  const mine = S.loans.filter(l => l.by === S.me);
  const open = mine.filter(l => OPEN.includes(l.stato));
  const past = mine.filter(l => !OPEN.includes(l.stato));
  return `<div class="head"><div><h2>I miei prestiti</h2><p class="muted">Gli attrezzi che hai chiesto alla rete, dalla richiesta alla restituzione.</p></div>
    <button class="btn primary" type="button" data-act="tab" data-id="catalogo">Cerca un attrezzo</button></div>
    <div class="section">${open.length ? open.map(l => loanCard(l)).join('') : `<div class="empty">Nessun prestito in corso.<button class="btn" type="button" data-act="tab" data-id="catalogo">Apri il catalogo</button></div>`}</div>
    ${past.length ? `<details class="history"><summary>Prestiti conclusi (${past.length})</summary><div class="list">${past.map(l => loanCard(l, { quiet: true })).join('')}</div></details>` : ''}`;
}

/* ---------- I miei attrezzi ---------- */
function vAttrezzi() {
  const mine = S.tools.filter(t => t.owner === S.me);
  const incoming = S.loans.filter(l => l.owner === S.me && OPEN.includes(l.stato));
  const others = S.officine.filter(o => o.id !== S.me);
  const intro = isMag() ? 'Gli attrezzi del magazzino, prestati alle officine come quelli della rete.' : 'Gli attrezzi che metti a disposizione dei colleghi. Decidi tu chi può vederli e se accettare ogni richiesta.';
  return `<div class="head"><div><h2>${isMag() ? 'Attrezzi del magazzino' : 'I miei attrezzi'}</h2><p class="muted">${intro}</p></div></div>
  ${!isMag() ? `<div class="section"><div class="section-title"><h3>Richieste e prestiti dei tuoi attrezzi</h3></div>
    ${incoming.length ? incoming.map(l => loanCard(l)).join('') : `<div class="empty">Nessuna richiesta per i tuoi attrezzi.</div>`}</div>` : ''}
  <div class="section"><div class="section-title"><h3>${isMag() ? 'Attrezzi' : 'Attrezzi condivisi'} (${mine.length})</h3></div>
    <div class="list">${mine.length ? mine.map(t => myToolRow(t)).join('') : `<div class="empty">Non hai ancora messo a disposizione attrezzi.</div>`}</div></div>
  <form class="panel" id="addForm">
    <h3>Aggiungi un attrezzo</h3>
    <div class="grid-2">
      <label class="field"><span>Nome dell'attrezzo</span><input type="text" id="add-nome" required placeholder="es. Kit messa in fase 1.5 dCi"></label>
      <label class="field"><span>Categoria</span><select id="add-cat">${CATS.map(c => `<option>${c}</option>`).join('')}</select></label>
    </div>
    <label class="field"><span>Compatibilità</span><input type="text" id="add-compat" placeholder="es. Renault, Dacia, Nissan"><small>Marche, motori o misure: aiuta i colleghi a trovarlo.</small></label>
    ${isMag() ? '' : `<div class="field"><span>Chi può vederlo</span>
      <div class="radios"><label><input type="radio" name="vis" value="tutti" checked> Tutta la rete</label><label><input type="radio" name="vis" value="scelte"> Solo officine che scelgo</label></div>
      <div class="checks" id="add-who" hidden>${others.map(o => `<label><input type="checkbox" value="${o.id}"> ${esc(o.nome)}</label>`).join('')}</div></div>
    <label class="radios"><input type="checkbox" id="add-lic"> È uno strumento di diagnosi con licenza software intestata alla mia officina</label>`}
    <p class="err" id="add-err" hidden></p>
    <div class="row-end"><button class="btn primary" type="submit">Metti a disposizione</button></div>
  </form>`;
}

function myToolRow(t) {
  const busy = activeLoan(t.id);
  const st = busy ? `<span class="pill warn">In prestito a ${esc(short(busy.by))} fino al ${fmt(busy.al)}</span>` : t.visibile ? `<span class="pill ok">Visibile nella rete</span>` : `<span class="pill muted">Nascosto</span>`;
  const who = t.a === 'tutti' ? 'Tutta la rete' : 'Solo: ' + t.a.map(short).join(', ');
  return `<article class="tool"><div style="min-width:0"><div class="tool-cat">${esc(t.cat)}</div><h3>${esc(t.nome)}</h3>
    <div class="tool-meta"><span class="mono">${esc(t.compat)}</span><span>${esc(who)}</span></div></div>
    <div class="tool-side">${st}${busy ? '' : `<button class="btn" type="button" data-act="toggle" data-id="${t.id}">${t.visibile ? 'Nascondi' : 'Rendi visibile'}</button>`}</div></article>`;
}

function submitAdd() {
  const err = $('#add-err');
  const nome = $('#add-nome').value.trim();
  if (!nome) { err.textContent = 'Scrivi il nome dell\'attrezzo.'; err.hidden = false; return; }
  if (!isMag() && $('#add-lic').checked) { err.textContent = 'Gli strumenti con licenza intestata alla tua officina non si possono prestare: la licenza non è cedibile.'; err.hidden = false; return; }
  let a = 'tutti';
  if (!isMag() && document.querySelector('input[name="vis"]:checked').value === 'scelte') {
    a = [...document.querySelectorAll('#add-who input:checked')].map(i => i.value);
    if (!a.length) { err.textContent = 'Scegli almeno un\'officina che può vederlo, oppure rendilo visibile a tutta la rete.'; err.hidden = false; return; }
  }
  S.tools.push({ id: uid('t'), nome, cat: $('#add-cat').value, owner: S.me, compat: $('#add-compat').value.trim() || 'Universale', visibile: true, a });
  render();
  toast(`${nome} è ora nel catalogo della rete`);
}

/* ---------- Fondo attrezzi ---------- */
function vFondo() {
  const F = S.fondo;
  const props = [...F.proposte].sort((x, y) => y.voti.length - x.voti.length || y.cercato - x.cercato);
  return `<div class="head"><div><h2>Fondo attrezzi</h2><p class="muted">Il magazzino accantona una quota dei ricambi acquistati dalla rete per comprare nuovi attrezzi da condividere. Le officine non versano nulla: propongono e votano.</p></div></div>
  <div class="fund">
    <div class="balance"><span>Saldo disponibile</span><b>${eur.format(F.saldo)}</b><span>Alimentato con ${esc(F.quota)}</span>
      ${F.acquisti.length ? `<span style="margin-top:10px">Ultimi acquisti</span>${F.acquisti.slice(0, 3).map(a => `<div style="font-size:.9rem">${esc(a.nome)} · ${eur.format(a.spesa)} · ${fmt(a.data)}</div>`).join('')}` : ''}
    </div>
    <div class="section">
      <div class="section-title"><h3>Proposte delle officine</h3><span class="muted" style="font-size:.9rem">Ordinate per voti</span></div>
      <div class="list">${props.map(propRow).join('') || `<div class="empty">Nessuna proposta.</div>`}</div>
      <form class="panel" id="propForm"><div class="grid-2">
        <label class="field"><span>Proponi un attrezzo</span><input type="text" id="prop-nome" required placeholder="es. Kit messa in fase 1.2 PureTech"></label>
        ${isMag() ? `<label class="field"><span>Prezzo stimato (€)</span><input type="number" id="prop-stima" min="0" step="10" placeholder="es. 450"></label>` : `<div class="field"><span>&nbsp;</span><small>Il magazzino stima il prezzo e decide l'acquisto in base ai voti.</small></div>`}
      </div><div class="row-end"><button class="btn primary" type="submit">Aggiungi la proposta</button></div></form>
    </div>
  </div>`;
}

function propRow(p) {
  const voted = p.voti.includes(S.me);
  let act;
  if (isMag()) {
    act = `<input type="number" id="stima-${p.id}" min="0" step="10" value="${p.stima ?? ''}" placeholder="€" aria-label="Prezzo per ${esc(p.nome)}"><button class="btn primary" type="button" data-act="buy" data-id="${p.id}">Acquista con il fondo</button>`;
  } else {
    act = `<button class="btn${voted ? '' : ' primary'}" type="button" data-act="vote" data-id="${p.id}" aria-pressed="${voted}">${voted ? 'Hai votato · togli' : 'Vota'}</button>`;
  }
  return `<article class="prop"><div class="votes"><b>${p.voti.length}</b><span>voti</span></div>
    <div style="min-width:0"><h3>${esc(p.nome)}</h3><div class="tool-meta"><span>${p.stima ? 'Stima ' + eur.format(p.stima) : 'Prezzo da stimare'}</span><span>Cercato ${p.cercato} ${p.cercato === 1 ? 'volta' : 'volte'} nel catalogo</span></div></div>
    <div class="prop-act">${act}</div></article>`;
}

/* ---------- Cruscotto magazzino ---------- */
function vCruscotto() {
  const L = S.loans;
  const daApprovare = L.filter(l => l.stato === 'accettata');
  const giro = L.filter(l => ['approvata', 'ritirata', 'rientro'].includes(l.stato) || (l.stato === 'consegnata' && (l.ritiroPrenotato || late(l))));
  const inUso = L.filter(l => l.stato === 'consegnata');
  const inRitardo = L.filter(late);
  const attesa = L.filter(l => l.stato === 'richiesta');
  const chiusi = L.filter(l => ['chiusa', 'rifiutata', 'annullata'].includes(l.stato));
  const kpi = (n, t, hot) => `<div class="kpi${hot && n ? ' hot' : ''}"><b>${n}</b><span>${t}</span></div>`;
  const byGiro = GIRI.map(g => [g, giro.filter(l => (l.giro || '15:30') === g)]).filter(([, ls]) => ls.length);
  return `<div class="head"><div><h2>Cruscotto del magazzino</h2><p class="muted">Approva le richieste, organizza i ritiri sui giri consegne e controlla gli attrezzi al rientro.</p></div></div>
  <div class="kpis">${kpi(daApprovare.length, 'Da approvare', true)}${kpi(giro.length, 'Da muovere sui giri', true)}${kpi(inUso.length, 'Attrezzi in uso')}${kpi(inRitardo.length, 'In ritardo', true)}</div>
  <div class="section"><div class="section-title"><h3>Da approvare</h3></div>
    ${daApprovare.length ? daApprovare.map(l => loanCard(l)).join('') : `<div class="empty">Nessuna richiesta da approvare.</div>`}</div>
  <div class="section"><div class="section-title"><h3>Giri consegne di oggi</h3></div>
    ${byGiro.length ? byGiro.map(([g, ls]) => `<div class="giro"><div class="giro-h"><span class="mono">${g}</span> Giro delle ${g}</div>${ls.map(l => loanCard(l)).join('')}</div>`).join('') : `<div class="empty">Nessun attrezzo da muovere oggi.</div>`}</div>
  <div class="section"><div class="section-title"><h3>In uso presso le officine</h3></div>
    ${inUso.filter(l => !giro.includes(l)).map(l => loanCard(l, { quiet: true })).join('') || `<div class="empty">Nessun altro attrezzo in uso.</div>`}</div>
  ${attesa.length ? `<div class="section"><div class="section-title"><h3>In attesa delle officine proprietarie</h3></div>${attesa.map(l => loanCard(l, { quiet: true })).join('')}</div>` : ''}
  ${chiusi.length ? `<details class="history"><summary>Storico prestiti (${chiusi.length})</summary><div class="list">${chiusi.map(l => loanCard(l, { quiet: true })).join('')}</div></details>` : ''}`;
}

/* ---------- Officine ---------- */
function vRete() {
  const rows = S.officine.map(o => {
    const shared = myShared(o.id);
    const dati = S.loans.filter(l => l.owner === o.id && ['consegnata', 'rientro', 'chiusa'].includes(l.stato)).length;
    const ricevuti = S.loans.filter(l => l.by === o.id && ['consegnata', 'rientro', 'chiusa'].includes(l.stato)).length;
    const danni = S.loans.filter(l => l.by === o.id && l.esito === 'scorretto').length;
    const st = o.sospesa ? `<span class="pill crit">Sospesa</span>` : shared ? `<span class="pill ok">Attiva</span>` : `<span class="pill warn">Non condivide</span>`;
    return `<tr><td><b>${esc(o.nome)}</b><div class="muted" style="font-size:.85rem">${esc(o.citta)}</div></td><td class="num">${shared}</td><td class="num">${dati}</td><td class="num">${ricevuti}</td><td class="num">${danni}</td><td>${st}</td>
      <td><button class="btn${o.sospesa ? ' primary' : ' danger'}" type="button" data-act="suspend" data-id="${o.id}">${o.sospesa ? 'Riattiva' : 'Sospendi'}</button></td></tr>`;
  }).join('');
  return `<div class="head"><div><h2>Officine della rete</h2><p class="muted">Chi presta e chi prende. Un'officina che non condivide attrezzi non può chiedere prestiti; puoi sospendere chi rovina gli attrezzi o restituisce in ritardo.</p></div></div>
  <div class="table-wrap"><table><thead><tr><th>Officina</th><th class="num">Attrezzi condivisi</th><th class="num">Prestiti dati</th><th class="num">Prestiti ricevuti</th><th class="num">Danni da uso scorretto</th><th>Stato</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- Azioni ---------- */
const loan = id => S.loans.find(l => l.id === id);
const actions = {
  tab: id => { S.tab = id; render(); window.scrollTo({ top: 0 }); },
  cat: id => { S.cat = id; document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.id === id)); renderResults(); save(); },
  ask: id => openAsk(id),
  close: () => $('#dlg').close(),
  goadd: () => { $('#dlg').close(); S.tab = 'attrezzi'; render(); },
  accept: id => { const l = loan(id); l.stato = 'accettata'; render(); toast('Prestito accettato: ora lo approva il magazzino'); },
  decline: id => { const l = loan(id); l.stato = 'rifiutata'; render(); toast('Richiesta rifiutata'); },
  cancel: id => { loan(id).stato = 'annullata'; render(); toast('Richiesta annullata'); },
  approve: id => { const l = loan(id); l.giro = $('#giro-' + id).value; l.stato = 'approvata'; render(); toast(`Approvato: ritiro con il giro delle ${l.giro}`); },
  reject: id => { loan(id).stato = 'rifiutata'; render(); toast('Richiesta rifiutata dal magazzino'); },
  pickup: id => { if (!$('#foto-' + id).checked) { toast('Scatta le foto di uscita: sono la prova in caso di danno'); return; } const l = loan(id); l.stato = 'ritirata'; render(); toast(`Ritirato da ${short(l.owner)}`); },
  deliver: id => { const l = loan(id); l.stato = 'consegnata'; render(); toast(`Consegnato a ${short(l.by)}`); },
  book: id => { loan(id).ritiroPrenotato = true; render(); toast('Ritiro prenotato: il magazzino passa con il prossimo giro'); },
  collect: id => { const l = loan(id); l.giro = $('#giro-' + id).value; l.stato = 'rientro'; render(); toast(`Ritirato da ${short(l.by)}, in rientro`); },
  'close-loan': id => {
    if (!$('#foto-' + id).checked) { toast('Scatta le foto di rientro prima di chiudere il prestito'); return; }
    const l = loan(id); l.esito = $('#esito-' + id).value; l.stato = 'chiusa'; render();
    toast(l.esito === 'scorretto' ? `Prestito chiuso. Risarcimento chiesto a ${name(l.by)}` : 'Prestito chiuso e attrezzo riconsegnato');
  },
  toggle: id => { const t = tool(id); t.visibile = !t.visibile; render(); toast(t.visibile ? 'Attrezzo visibile nella rete' : 'Attrezzo nascosto'); },
  vote: id => { const p = S.fondo.proposte.find(x => x.id === id); p.voti = p.voti.includes(S.me) ? p.voti.filter(v => v !== S.me) : [...p.voti, S.me]; render(); },
  buy: id => {
    const p = S.fondo.proposte.find(x => x.id === id);
    const prezzo = Number($('#stima-' + id).value);
    if (!prezzo) { toast('Inserisci il prezzo per acquistarlo'); return; }
    if (prezzo > S.fondo.saldo) { toast(`Saldo insufficiente: mancano ${eur.format(prezzo - S.fondo.saldo)}`); return; }
    S.fondo.saldo -= prezzo;
    S.fondo.acquisti.unshift({ nome: p.nome, spesa: prezzo, data: TODAY });
    S.fondo.proposte = S.fondo.proposte.filter(x => x.id !== id);
    S.tools.push({ id: uid('t'), nome: p.nome, cat: 'Da classificare', owner: MAG, compat: 'Da completare', visibile: true, a: 'tutti' });
    render(); toast(`${p.nome} acquistato e aggiunto al catalogo`);
  },
  wanted: () => {
    const q = S.q.trim();
    const p = S.fondo.proposte.find(x => x.nome.toLowerCase() === q.toLowerCase());
    if (p) { p.cercato++; if (!p.voti.includes(S.me)) p.voti.push(S.me); }
    else S.fondo.proposte.push({ id: uid('p'), nome: q, stima: null, voti: [S.me], cercato: 1 });
    S.q = ''; S.tab = 'fondo'; render(); toast('Segnalazione aggiunta al fondo attrezzi');
  },
  suspend: id => { const o = off(id); o.sospesa = !o.sospesa; render(); toast(o.sospesa ? `${o.nome} sospesa` : `${o.nome} riattivata`); },
  reset: () => { S = seed(); render(); toast('Dati della demo ripristinati'); }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const fn = actions[b.dataset.act];
  if (fn) { e.preventDefault(); fn(b.dataset.id); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'askForm') submitAsk(e.target);
  if (e.target.id === 'addForm') submitAdd();
  if (e.target.id === 'propForm') {
    const nome = $('#prop-nome').value.trim(); if (!nome) return;
    const stima = isMag() ? Number($('#prop-stima').value) || null : null;
    S.fondo.proposte.push({ id: uid('p'), nome, stima, voti: isMag() ? [] : [S.me], cercato: 0 });
    render(); toast('Proposta aggiunta');
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; renderResults(); save(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'me') { S.me = e.target.value; S.tab = isMag() ? 'cruscotto' : 'catalogo'; S.q = ''; render(); toast(`Ora vedi la demo come ${name(S.me)}`); }
  if (e.target.name === 'vis') $('#add-who').hidden = e.target.value !== 'scelte';
});
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) $('#dlg').close(); });

render();
})();
</script>
</body>
</html>
